<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather-App</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">

     <style>
        body {
            font-family: 'Roboto', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #333;
        }
        .container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            text-align: center;
            max-width: 450px;
            width: 90%;
            transition: transform 0.3s ease;
        }
        .container:hover {
            transform: translateY(-5px);
        }
        h1 {
            margin-bottom: 20px;
            color: #4a4a4a;
            font-weight: 500;
        }
        input {
            width: calc(100% - 20px);
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.3s;
        }
        input:focus {
            border-color: #667eea;
        }
        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s, transform 0.2s;
        }
        button:hover {
            background: linear-gradient(135deg, #5a6fd8, #6a4190);
            transform: scale(1.05);
        }
        .weather-info {
            margin-top: 20px;
            display: none;
        }
        .weather-card {
            background: #f9f9f9;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }
        .weather-icon {
            width: 80px;
            height: 80px;
            margin: 10px 0;
        }
        .weather-info h2 {
            margin: 0 0 10px 0;
            font-weight: 500;
        }
        .weather-details {
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
        }
        .detail {
            margin: 10px;
            text-align: center;
        }
        .detail p {
            margin: 5px 0;
            font-weight: 300;
        }
        .error {
            color: #e74c3c;
            margin-top: 10px;
            display: none;
        }
        .loading {
            display: none;
            margin-top: 20px;
        }
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }
            .weather-details {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
     <div class="container">
        <h1>Professional Weather App</h1>
        <input type="text" id="cityInput" placeholder="Enter city name (e.g., New York)" />
        <button onclick="getWeather()">Get Weather</button>
        <div id="loading" class="loading">
            <div class="spinner"></div>
            <p>Loading...</p>
        </div>
        <div id="error" class="error">City not found. Please try again.</div>
        <div id="weatherDisplay" class="weather-info">
            <div class="weather-card">
                <h2 id="cityName"></h2>
                <img id="weatherIcon" class="weather-icon" src="" alt="Weather Icon" />
                <p id="temperature" style="font-size: 24px; font-weight: 500;"></p>
                <p id="description"></p>
                <div class="weather-details">
                    <div class="detail">
                        <p>Humidity</p>
                        <p id="humidity"></p>
                    </div>
                    <div class="detail">
                        <p>Wind Speed</p>
                        <p id="windSpeed"></p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>

</body>
</html>
